<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GDPS MANAGER</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23FF4D8D'/><rect x='28' y='28' width='44' height='44' fill='%2314122B'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
:root{--bg:#14122B;--panel:#1E1B3F;--line:#322E63;--tx:#EDEBFF;--mut:#9C98C9;--pink:#FF4D8D;--cyan:#3FD5FF;--ok:#4ADE80;--bad:#FF6B6B;font-family:Rubik,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:.5rem .9rem;background:var(--line);transition:background .15s}
button:hover{background:#443f86}
button.pri{background:var(--pink);color:#fff;font-weight:500}
button.pri:hover{background:#ff6ba0}
button.dng{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button.sm{padding:.3rem .6rem;font-size:.85rem}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem}
label{display:block;margin:.7rem 0 .25rem;color:var(--mut);font-size:.9rem}
header{display:flex;align-items:center;gap:1rem;padding:.8rem 1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{margin:0;font-size:1.2rem}header h1 b{color:var(--pink)}
.who{margin-left:auto;color:var(--mut);font-size:.85rem;display:flex;gap:.6rem;align-items:center}
nav{display:flex;gap:.3rem;overflow-x:auto;padding:.6rem 1rem;border-bottom:1px solid var(--line)}
nav button{background:transparent;white-space:nowrap;color:var(--mut)}
nav button.on{background:var(--panel);color:var(--tx);box-shadow:inset 0 -2px var(--pink)}
main{padding:1rem;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem;display:flex;flex-direction:column;gap:.4rem}
.card h3{margin:0;font-size:1.1rem}
.l{color:var(--mut);font-size:.9rem}
.card p{margin:0;line-height:1.4;word-break:break-word}
.links{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:auto;padding-top:.4rem}
.bar{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.bar input{flex:1;min-width:160px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:.6rem .8rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:500;font-size:.9rem;background:var(--panel)}
tr:last-child td{border-bottom:0}
td.act{white-space:nowrap;display:flex;gap:.3rem}
.tag{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.8rem;background:var(--line)}
.tag.ok{background:#14532d;color:var(--ok)}.tag.bad{background:#5b1a1a;color:var(--bad)}.tag.cy{background:#0c4a5e;color:var(--cyan)}
.empty{padding:2rem;text-align:center;color:var(--mut)}
.note{color:var(--mut);max-width:60ch;line-height:1.5}
.sub{display:flex;gap:.3rem;margin:1rem 0;overflow-x:auto}
.sub button{background:transparent;color:var(--mut)}.sub button.on{background:var(--panel);color:var(--tx);box-shadow:inset 0 -2px var(--cyan)}
.ficha{max-width:520px}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:14px;width:min(420px,92vw);padding:1.2rem}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 .5rem;font-size:1.1rem}
.msg{margin-top:.8rem;color:var(--bad);min-height:1.2em;font-size:.95rem;word-break:break-word}
pre{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem;overflow:auto;font-size:.8rem;line-height:1.5}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--cyan);padding:.6rem 1rem;border-radius:10px;z-index:9;max-width:90vw}
.pre{white-space:pre-wrap;word-break:break-word}
.post{margin-bottom:.8rem}
.chatbox{max-height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;padding:.2rem}
.cm{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.5rem .8rem;max-width:90%;align-self:flex-start}
.cm.me{align-self:flex-end;border-color:var(--pink)}
progress{accent-color:var(--pink)}
h3{margin:1.5rem 0 .5rem}
.term{background:#0b0a1c;border:1px solid var(--line);border-radius:12px;padding:.8rem;height:50vh;overflow-y:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;line-height:1.5}
.term div{white-space:pre-wrap;word-break:break-word}
.term .in{color:var(--cyan)}.term .err{color:var(--bad)}
.tin{display:flex;gap:.5rem;margin-top:.6rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 .8rem}
.chips button{font-size:.85rem}.chips button.on{background:var(--pink);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>GDPS <b>MANAGER</b></h1><div class="who" id="who"></div></header>
<nav id="nav"></nav>
<main id="view"></main>

<dialog id="auth">
  <form id="afrm" method="dialog">
    <h2>Entrar a GDPS MANAGER</h2>
    <label for="em">Correo</label><input id="em" type="email" autocomplete="email">
    <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password">
    <div class="row"><button type="button" class="pri" id="btnIn">Entrar</button><button type="button" id="btnUp">Crear cuenta</button><button type="button" id="aNo">Cerrar</button></div>
    <div class="msg" id="aMsg"></div>
  </form>
</dialog>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <h2 id="dlgT"></h2><div id="dlgF"></div>
    <div class="row"><button class="pri" value="ok">Guardar</button><button type="button" id="dlgNo">Cancelar</button></div>
  </form>
</dialog>

<dialog id="apkDlg">
  <h2>Subir APK</h2>
  <label for="a_name">Nombre</label><input id="a_name" maxlength="60">
  <label for="a_ver">Versión (opcional)</label><input id="a_ver" maxlength="20">
  <label for="a_desc">Descripción (opcional)</label><textarea id="a_desc" rows="2" maxlength="300"></textarea>
  <label for="a_file">Archivo APK de tu celular</label><input id="a_file" type="file" accept=".apk,application/vnd.android.package-archive">
  <progress id="a_prog" value="0" max="100" style="width:100%;margin-top:.6rem"></progress><div class="l" id="a_pt"></div>
  <label for="a_link">…o pega un link de descarga</label><input id="a_link" placeholder="https://...">
  <div class="row"><button class="pri" id="apkOk">Guardar</button><button id="apkNo">Cancelar</button></div>
  <div class="msg" id="a_msg"></div>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,updateDoc,deleteDoc,onSnapshot,serverTimestamp,query,where,orderBy,limit,arrayUnion,arrayRemove,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getStorage,ref as sref,uploadBytesResumable,getDownloadURL,deleteObject} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app=initializeApp({
  apiKey:"AIzaSyDtTHh-lEkgbvYpkM_YApre2qHzTlyTeIM",
  authDomain:"gdma-c6f47.firebaseapp.com",
  projectId:"gdma-c6f47",
  storageBucket:"gdma-c6f47.firebasestorage.app",
  messagingSenderId:"37211496586",
  appId:"1:37211496586:web:f4839f0b97b5db321d8d73"
});
const auth=getAuth(app), db=getFirestore(app), storage=getStorage(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url=u=>/^https?:\/\//i.test(u||"")?esc(u):"";
const errTxt=e=>({"auth/invalid-credential":"Correo o contraseña incorrectos.","auth/email-already-in-use":"Ese correo ya tiene cuenta. Pulsa Entrar.","auth/weak-password":"La contraseña necesita al menos 6 caracteres.","auth/invalid-email":"El correo no es válido.","permission-denied":"No tienes permiso, o faltan las reglas nuevas en Firestore (pestaña Reglas)."}[e.code]||e.message);
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3500)}

/* ---------- Esquemas ---------- */
const FG=[
 {k:"name",l:"Nombre del GDPS"},{k:"owner",l:"Nombre del dueño"},
 {k:"desc",l:"Descripción",t:"textarea",opt:1},
 {k:"discord",l:"Link de Discord",opt:1,u:1},{k:"apk",l:"Descarga Android (APK)",opt:1,u:1},
 {k:"pc",l:"Descarga PC",opt:1,u:1},{k:"dash",l:"Link del dashboard",opt:1,u:1}];
const SUB={
 announcements:{label:"Anuncios",one:"anuncio",fields:[{k:"title",l:"Título"},{k:"body",l:"Mensaje",t:"textarea"}],cols:["title","body","createdAt"]},
 levels:{label:"Niveles",one:"nivel",fields:[{k:"name",l:"Nombre del nivel"},{k:"author",l:"Autor"},
  {k:"difficulty",l:"Dificultad",t:"select",o:["Auto","Easy","Normal","Hard","Harder","Insane","Demon"],d:"Normal"},{k:"downloads",l:"Descargas",t:"number",d:0}],
  cols:["name","author","difficulty","downloads","featured"],toggle:{k:"featured",on:"Quitar destacado",off:"Destacar"},init:{featured:false}},
 members:{label:"Usuarios",one:"usuario",fields:[{k:"name",l:"Nombre"},{k:"role",l:"Rol",t:"select",o:["Jugador","Mod","Admin"],d:"Jugador"},{k:"stars",l:"Estrellas",t:"number",d:0}],
  cols:["name","role","stars","banned"],toggle:{k:"banned",on:"Desbanear",off:"Banear"},init:{banned:false}}
};
const SUBTABS=["ficha",...Object.keys(SUB)];
const SN={ficha:"Ficha"};

/* ---------- Estado ---------- */
let user=null,view="dir",cur=null,sub="ficha",q="",store=[],all=[],subData=[],subUnsub=null,mineUnsub=null;
const mapDocs=s=>s.docs.map(d=>({id:d.id,...d.data()}));
onSnapshot(query(collection(db,"gdps"),where("published","==",true)),s=>{store=mapDocs(s);render()},e=>toast(errTxt(e)));
onAuthStateChanged(auth,u=>{
  user=u;if(mineUnsub){mineUnsub();mineUnsub=null}all=[];
  if(u){$("auth").close();mineUnsub=onSnapshot(query(collection(db,"gdps"),where("ownerUid","==",u.uid)),s=>{all=mapDocs(s);render()},e=>toast(errTxt(e)))}
  else if(["mine","gdps","terminal"].includes(view))view="dir";
  render()});

/* ---------- Auth ---------- */
const am=m=>$("aMsg").textContent=m;
function openAuth(){am("");$("auth").showModal()}
$("aNo").onclick=()=>$("auth").close();
$("btnIn").onclick=()=>signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value).catch(e=>am(errTxt(e)));
$("btnUp").onclick=()=>createUserWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value).catch(e=>am(errTxt(e)));

/* ---------- Formulario genérico ---------- */
function form(title,fields,vals,onSave){
  $("dlgT").textContent=title;
  $("dlgF").innerHTML=fields.map(f=>{
    const val=vals?vals[f.k]:(f.d??"");const id="f_"+f.k;
    const inp=f.t==="select"?`<select id="${id}">${f.o.map(o=>`<option ${o==val?"selected":""}>${esc(o)}</option>`).join("")}</select>`
      :f.t==="textarea"?`<textarea id="${id}" rows="3">${esc(val)}</textarea>`
      :`<input id="${id}" type="${f.t||"text"}" value="${esc(val)}">`;
    return `<label for="${id}">${esc(f.l)}</label>${inp}`}).join("");
  const d=$("dlg");d.showModal();$("dlgNo").onclick=()=>d.close();
  $("frm").onsubmit=async e=>{
    e.preventDefault();const o=read(fields,"f_");if(!o)return;
    try{await onSave(o);d.close();toast("Guardado")}catch(er){toast(errTxt(er))}
  };
}
function read(fields,pre){
  const o={};
  for(const f of fields){
    let x=$(pre+f.k).value.trim();if(f.t==="number")x=Number(x)||0;
    if(x===""&&!f.opt){toast("Completa “"+f.l+"”");return null}
    if(f.u&&x&&!/^https?:\/\//i.test(x)){toast("“"+f.l+"” debe empezar con https://");return null}
    o[f.k]=x}
  return o;
}

/* ---------- Render ---------- */
function setNav(){
  const t=[["dir","GDPS Store"],["global","Global"],["apk","APKs"]];if(user)t.push(["mine","Mis GDPS"],["terminal","Terminal"]);t.push(["rules","Reglas"]);
  $("nav").innerHTML=t.map(([k,l])=>`<button data-v="${k}" class="${(view===k||(view==="gdps"&&k==="mine"))?"on":""}">${l}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.v));
  $("who").innerHTML=user?`<span>${esc(user.email)}</span><button class="sm" id="out">Salir</button>`:`<button class="pri sm" id="inb">Entrar</button>`;
  if(user)$("out").onclick=()=>signOut(auth);else $("inb").onclick=openAuth;
}
function go(v){view=v;q="";if(subUnsub){subUnsub();subUnsub=null}render()}
function keepSearch(fn){const i=$("q");if(!i)return;i.oninput=()=>{q=i.value;fn();const n=$("q");n.focus();n.setSelectionRange(q.length,q.length)}}

function gcard(g,mine){
  const links=[["Discord",g.discord],["Android",g.apk],["PC",g.pc],["Dashboard",g.dash]].filter(x=>url(x[1]))
    .map(([l,u])=>`<a href="${url(u)}" target="_blank" rel="noopener">${l}</a>`).join("");
  return `<div class="card"><h3>${esc(g.name)}</h3>${mine?`<div><span class="tag ${g.published?"ok":""}">${g.published?"Publicado en la Store":"Borrador"}</span></div>`:""}<div class="l">por ${esc(g.owner)}</div>${g.desc?`<p>${esc(g.desc)}</p>`:""}
    <div class="links">${links||'<span class="l">Sin links todavía</span>'}</div>
    ${mine?`<button class="pri sm" data-m="${g.id}">Gestionar</button>`:""}</div>`;
}
function render(){
  setNav();const v=$("view");
  if(view==="global"){renderGlobal();return}
  if(view==="apk"){renderApk();return}
  if(view==="terminal"){renderTerminal();return}
  if(view==="rules"){
    v.innerHTML=`<p class="note">Copia cada bloque donde corresponde y toca Publicar.</p>
    <h3>1. Firebase → Firestore → Reglas</h3><div class="row" style="margin:0 0 1rem"><button class="pri" id="cp">Copiar reglas de Firestore</button></div><pre>${esc(RULES)}</pre>
    <h3>2. Firebase → Storage → Reglas (solo si subes APKs con Storage)</h3><div class="row" style="margin:0 0 1rem"><button class="pri" id="cp2">Copiar reglas de Storage</button></div><pre>${esc(SRULES)}</pre>`;
    $("cp").onclick=()=>copy(RULES,"Reglas copiadas");$("cp2").onclick=()=>copy(SRULES,"Reglas copiadas");return;
  }
  if(view==="dir"){
    const rows=store.filter(g=>!q||(g.name+g.owner+g.desc).toLowerCase().includes(q.toLowerCase()));
    v.innerHTML=`<div class="bar"><input id="q" placeholder="Buscar en la GDPS Store" value="${esc(q)}">${user?"":'<button class="pri" id="inb2">Entrar para publicar el tuyo</button>'}</div>
    ${rows.length?`<div class="grid">${rows.map(g=>gcard(g,false)).join("")}</div>`:`<div class="empty">La GDPS Store está vacía. Entra, registra tu GDPS y publícalo.</div>`}`;
    keepSearch(render);if($("inb2"))$("inb2").onclick=openAuth;return;
  }
  if(view==="mine"){
    const mine=all.filter(g=>g.ownerUid===user.uid);
    v.innerHTML=`<div class="bar"><button class="pri" id="new">Registrar GDPS</button></div>
    ${mine.length?`<div class="grid">${mine.map(g=>gcard(g,true)).join("")}</div>`:`<div class="empty">Todavía no has registrado ningún GDPS. Pulsa “Registrar GDPS”.</div>`}`;
    $("new").onclick=()=>form("Registrar GDPS",FG,null,async o=>{
      const r=await addDoc(collection(db,"gdps"),{...o,ownerUid:user.uid,published:false,createdAt:serverTimestamp()});
      cur=r.id;sub="ficha";view="gdps";render()});
    v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{cur=b.dataset.m;sub="ficha";q="";view="gdps";subscribe();render()});return;
  }
  if(view==="gdps"){
    const g=all.find(x=>x.id===cur);
    if(!user){view="dir";render();return}
    if(!g){v.innerHTML='<div class="empty">Cargando…</div>';return}
    v.innerHTML=`<div class="bar"><button id="back">← Mis GDPS</button><h2 style="margin:0">${esc(g.name)}</h2></div>
    <div class="sub">${SUBTABS.map(t=>`<button data-s="${t}" class="${t===sub?"on":""}">${esc(SN[t]||SUB[t].label)}</button>`).join("")}</div><div id="body"></div>`;
    $("back").onclick=()=>go("mine");
    v.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sub=b.dataset.s;q="";subscribe();render()});
    sub==="ficha"?ficha(g):table();
  }
}
function ficha(g){
  $("body").innerHTML=`<div class="ficha"><p class="note">${g.published?"Tu GDPS aparece en la GDPS Store.":"Tu GDPS es un borrador: solo tú lo ves. Pulsa Publicar para mostrarlo en la GDPS Store."}</p>${FG.map(f=>`<label for="g_${f.k}">${esc(f.l)}</label>${f.t==="textarea"?`<textarea id="g_${f.k}" rows="3">${esc(g[f.k])}</textarea>`:`<input id="g_${f.k}" value="${esc(g[f.k])}">`}`).join("")}
  <div class="row"><button class="pri" id="sv">Guardar ficha</button><button id="pub">${g.published?"Quitar de la GDPS Store":"Publicar en la GDPS Store"}</button><button class="dng" id="del">Eliminar GDPS</button></div></div>`;
  $("sv").onclick=async()=>{const o=read(FG,"g_");if(!o)return;try{await updateDoc(doc(db,"gdps",cur),o);toast("Ficha guardada")}catch(e){toast(errTxt(e))}};
  $("pub").onclick=async()=>{try{await updateDoc(doc(db,"gdps",cur),{published:!g.published});toast(g.published?"Quitado de la Store":"Publicado en la Store")}catch(e){toast(errTxt(e))}};
  $("del").onclick=async()=>{if(!confirm("¿Eliminar este GDPS? No se puede deshacer."))return;try{await deleteDoc(doc(db,"gdps",cur));go("mine")}catch(e){toast(errTxt(e))}};
}
function fmt(k,v){
  if(k==="banned")return v?'<span class="tag bad">Baneado</span>':'<span class="tag ok">Activo</span>';
  if(k==="featured")return v?'<span class="tag cy">Destacado</span>':"";
  if(k==="createdAt")return v?.toDate?esc(v.toDate().toLocaleDateString()):"";
  return esc(v);
}
function table(){
  const s=SUB[sub];
  const rows=subData.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  const H={banned:"Estado",featured:"Destacado",createdAt:"Fecha"};
  const head=s.cols.map(k=>`<th>${esc((s.fields.find(f=>f.k===k)||{}).l||H[k])}</th>`).join("")+"<th></th>";
  const body=rows.map(r=>`<tr>${s.cols.map(k=>`<td>${fmt(k,r[k])}</td>`).join("")}<td class="act">
    ${s.toggle?`<button class="sm" data-a="tg" data-id="${r.id}">${r[s.toggle.k]?s.toggle.on:s.toggle.off}</button>`:""}
    <button class="sm" data-a="ed" data-id="${r.id}">Editar</button><button class="sm dng" data-a="rm" data-id="${r.id}">Eliminar</button></td></tr>`).join("");
  $("body").innerHTML=`<div class="bar"><input id="q" placeholder="Buscar en ${esc(s.label.toLowerCase())}" value="${esc(q)}"><button class="pri" id="add">Añadir ${s.one}</button></div>
  <div class="wrap">${rows.length?`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`:`<div class="empty">No hay ${esc(s.label.toLowerCase())} todavía. Pulsa “Añadir ${s.one}”.</div>`}</div>`;
  keepSearch(table);
  $("add").onclick=()=>form("Añadir "+s.one,s.fields,null,o=>addDoc(collection(db,"gdps",cur,sub),{...o,...(s.init||{}),createdAt:serverTimestamp()}));
  $("body").querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id,r=subData.find(x=>x.id===id),ref=doc(db,"gdps",cur,sub,id);
    try{
      if(b.dataset.a==="tg")await updateDoc(ref,{[s.toggle.k]:!r[s.toggle.k]});
      else if(b.dataset.a==="rm"){if(confirm("¿Eliminar este "+s.one+"?"))await deleteDoc(ref)}
      else form("Editar "+s.one,s.fields,r,o=>updateDoc(ref,o));
    }catch(e){toast(errTxt(e))}
  });
}
function subscribe(){
  if(subUnsub){subUnsub();subUnsub=null}subData=[];
  if(sub==="ficha"||!cur)return;
  subUnsub=onSnapshot(collection(db,"gdps",cur,sub),s=>{subData=s.docs.map(d=>({id:d.id,...d.data()}));if(view==="gdps"&&sub!=="ficha")table()},e=>toast(errTxt(e)));
}

/* ---------- Global y APKs ---------- */
let gsub="posts",posts=[],chat=[],apks=[];
const aname=()=>user?(user.email||"usuario").split("@")[0]:"";
const when=t=>t?.toDate?t.toDate().toLocaleString():"";
const fmtSize=b=>!b?"":b>1048576?(b/1048576).toFixed(1)+" MB":Math.round(b/1024)+" KB";
function copy(t,m){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m||"Link copiado")).catch(()=>prompt("Copia el texto:",t))}
onSnapshot(query(collection(db,"global_posts"),orderBy("createdAt","desc"),limit(50)),s=>{posts=mapDocs(s);if(view==="global")renderGlobal()},e=>toast(errTxt(e)));
onSnapshot(query(collection(db,"global_chat"),orderBy("createdAt","desc"),limit(100)),s=>{chat=mapDocs(s);if(view==="global")renderGlobal()},e=>toast(errTxt(e)));
onSnapshot(query(collection(db,"apks"),orderBy("createdAt","desc"),limit(100)),s=>{apks=mapDocs(s);if(view==="apk")renderApk()},e=>toast(errTxt(e)));

function renderGlobal(){
  const v=$("view");
  if(!$("gshell")){
    v.innerHTML='<div id="gshell"><div class="sub"><button data-g="posts">Publicaciones</button><button data-g="chat">Chat</button></div><div id="gform"></div><div id="glist"></div></div>';
    v.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{gsub=b.dataset.g;renderGlobal()});
  }
  v.querySelectorAll("[data-g]").forEach(b=>b.classList.toggle("on",b.dataset.g===gsub));
  const key=gsub+(user?user.uid:"-"),f=$("gform");
  if(f.dataset.k!==key){
    f.dataset.k=key;
    if(!user)f.innerHTML='<div class="bar"><span class="note">Entra para participar.</span><button class="pri" id="gin">Entrar</button></div>';
    else if(gsub==="posts")f.innerHTML='<div class="card" style="margin-bottom:1rem"><textarea id="gp" rows="3" maxlength="1000" placeholder="¿Qué quieres compartir?"></textarea><div class="row" style="margin:0"><button class="pri" id="gsend">Publicar</button></div></div>';
    else f.innerHTML='<div class="bar"><input id="gc" maxlength="500" placeholder="Escribe un mensaje"><button class="pri" id="gsend">Enviar</button></div>';
    if(!user)$("gin").onclick=openAuth;
    else{
      const send=async()=>{
        const el=$(gsub==="posts"?"gp":"gc"),text=el.value.trim();if(!text)return;
        try{await addDoc(collection(db,gsub==="posts"?"global_posts":"global_chat"),{uid:user.uid,author:aname(),text,...(gsub==="posts"?{likes:[]}:{}),createdAt:serverTimestamp()});el.value=""}
        catch(e){toast(errTxt(e))}
      };
      $("gsend").onclick=send;
      if(gsub==="chat")$("gc").onkeydown=e=>{if(e.key==="Enter")send()};
    }
  }
  const L=$("glist");
  if(gsub==="posts"){
    L.className="";
    L.innerHTML=posts.length?posts.map(p=>{
      const n=(p.likes||[]).length,liked=user&&(p.likes||[]).includes(user.uid);
      return `<div class="card post"><div class="l"><b>${esc(p.author)}</b> · ${esc(when(p.createdAt))}</div><p class="pre">${esc(p.text)}</p><div class="row" style="margin:0"><button class="sm" data-l="${p.id}">${liked?"💜":"🤍"} ${n}</button>${user&&p.uid===user.uid?`<button class="sm dng" data-d="${p.id}">Eliminar</button>`:""}</div></div>`}).join(""):'<div class="empty">Aún no hay publicaciones. Sé el primero.</div>';
    L.querySelectorAll("[data-l]").forEach(b=>b.onclick=async()=>{
      if(!user){openAuth();return}
      const p=posts.find(x=>x.id===b.dataset.l);
      try{await updateDoc(doc(db,"global_posts",p.id),{likes:(p.likes||[]).includes(user.uid)?arrayRemove(user.uid):arrayUnion(user.uid)})}catch(e){toast(errTxt(e))}
    });
    L.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(!confirm("¿Eliminar tu publicación?"))return;try{await deleteDoc(doc(db,"global_posts",b.dataset.d))}catch(e){toast(errTxt(e))}});
  }else{
    L.className="chatbox";
    L.innerHTML=chat.length?[...chat].reverse().map(m=>`<div class="cm${user&&m.uid===user.uid?" me":""}"><div class="l"><b>${esc(m.author)}</b> · ${esc(when(m.createdAt))}${user&&m.uid===user.uid?` <a href="#" data-d="${m.id}">borrar</a>`:""}</div><div class="pre">${esc(m.text)}</div></div>`).join(""):'<div class="empty">Nadie ha escrito todavía. Di hola 👋</div>';
    L.querySelectorAll("[data-d]").forEach(a=>a.onclick=async e=>{e.preventDefault();try{await deleteDoc(doc(db,"global_chat",a.dataset.d))}catch(er){toast(errTxt(er))}});
    L.scrollTop=L.scrollHeight;
  }
}

function renderApk(){
  const v=$("view");
  const rows=apks.filter(a=>!q||(a.name+a.author+a.desc).toLowerCase().includes(q.toLowerCase()));
  v.innerHTML=`<div class="bar"><input id="q" placeholder="Buscar APK" value="${esc(q)}">${user?'<button class="pri" id="up">Subir APK</button>':'<button class="pri" id="inb3">Entrar para subir un APK</button>'}</div>
  ${rows.length?`<div class="grid">${rows.map(a=>`<div class="card"><h3>${esc(a.name)}</h3><div class="l">${a.version?esc("v"+a.version)+" · ":""}por ${esc(a.author)}${a.size?" · "+fmtSize(a.size):""}</div>${a.desc?`<p>${esc(a.desc)}</p>`:""}<div class="links"><a href="${url(a.url)}" target="_blank" rel="noopener">Descargar</a><button class="sm" data-c="${a.id}">Copiar link</button>${user&&a.uid===user.uid?`<button class="sm dng" data-x="${a.id}">Eliminar</button>`:""}</div></div>`).join("")}</div>`:'<div class="empty">Todavía no hay APKs. Sube el primero.</div>'}`;
  keepSearch(renderApk);
  if(user)$("up").onclick=openApk;else $("inb3").onclick=openAuth;
  v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>copy(apks.find(x=>x.id===b.dataset.c).url));
  v.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{
    const a=apks.find(x=>x.id===b.dataset.x);if(!confirm("¿Eliminar este APK?"))return;
    try{await deleteDoc(doc(db,"apks",a.id));if(a.path)deleteObject(sref(storage,a.path)).catch(()=>{})}catch(e){toast(errTxt(e))}
  });
}
const am2=m=>$("a_msg").textContent=m;
function openApk(){
  ["a_name","a_ver","a_desc","a_link","a_file"].forEach(i=>$(i).value="");
  $("a_prog").value=0;$("a_pt").textContent="";am2("");$("apkOk").disabled=false;$("apkDlg").showModal();
}
$("apkNo").onclick=()=>$("apkDlg").close();
$("apkOk").onclick=async()=>{
  const name=$("a_name").value.trim(),version=$("a_ver").value.trim(),desc=$("a_desc").value.trim(),file=$("a_file").files[0],link=$("a_link").value.trim();
  if(!name){am2("Escribe el nombre del APK.");return}
  if(link&&!/^https?:\/\//i.test(link)){am2("El link debe empezar con https://");return}
  if(!file&&!link){am2("Elige un archivo o pega un link.");return}
  let u=link,path="",size=0;
  $("apkOk").disabled=true;am2("");
  try{
    if(file){
      path=`apks/${user.uid}/${Date.now()}_${file.name.replace(/[^\w.\-]/g,"_")}`;
      const task=uploadBytesResumable(sref(storage,path),file);
      await new Promise((res,rej)=>task.on("state_changed",sn=>{const pc=sn.bytesTransferred/sn.totalBytes*100;$("a_prog").value=pc;$("a_pt").textContent=Math.round(pc)+"%"},rej,res));
      u=await getDownloadURL(task.snapshot.ref);size=file.size;
    }
    await addDoc(collection(db,"apks"),{uid:user.uid,author:aname(),name,version,desc,url:u,path,size,createdAt:serverTimestamp()});
    $("apkDlg").close();toast("APK publicado");
  }catch(e){
    am2(String(e.code||"").startsWith("storage/")?"No se pudo subir el archivo. Firebase Storage necesita el plan Blaze y sus reglas publicadas. Mientras tanto, pega un link de descarga.":errTxt(e));
  }finally{$("apkOk").disabled=false}
};

let tmode="plat",tlines=[],tgd=null,tpend=null;
const lsGet=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const toks=l=>(l.match(/"[^"]*"|\S+/g)||[]).map(x=>x.replace(/^"|"$/g,""));
function addLine(o,t,c){const d=document.createElement("div");if(c)d.className=c;d.textContent=t;o.append(d)}
function print(t,c){tlines.push([t,c||""]);if(tlines.length>300)tlines.shift();const o=$("tout");if(o){addLine(o,t,c||"");o.scrollTop=o.scrollHeight}}

        <li>Toca <b>Mi GDPS (real)</b> y escribe <b>ping</b>. Luego <b>schema</b> para ver que tu base coincide.</li>
        <li>Antes de usar comandos que modifican datos, exporta una copia de tu base en phpMyAdmin.</li>
      </ol>
      <p class="note">Sirve para GDPS basados en Cvolton. Si descargas el archivo otra vez se reutiliza la misma clave de este dispositivo.</p>
      <div class="row" style="margin-top:0"><button class="pri" id="t_dl">Descargar bridge.php</button></div></details>
    <details style="margin-bottom:.8rem"><summary class="l" style="cursor:pointer">Configurar conexión con mi GDPS</summary>
      <label for="t_url">URL de bridge.php</label><input id="t_url" placeholder="https://tu-gdps.com/bridge.php">
      <label for="t_key">Clave secreta</label><input id="t_key" type="password" autocomplete="off">
      <div class="row"><button class="pri" id="t_save">Guardar en este dispositivo</button></div></details>
    <div class="term" id="tout"></div>
    <div class="tin"><input id="tin" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="pri" id="tgo">Enviar</button></div></div>`;
    $("t_url").value=lsGet("gm_url");$("t_key").value=lsGet("gm_key");
    $("t_save").onclick=()=>{const u=$("t_url").value.trim();if(u&&!/^https:\/\//i.test(u)){toast("La URL debe empezar con https://");return}lsSet("gm_url",u);lsSet("gm_key",$("t_key").value.trim());toast("Guardado en este dispositivo")};
    $("t_dl").onclick=()=>{
      let key=lsGet("gm_key");
      if(key.length<16||/[^\w\-]/.test(key)){const r=new Uint8Array(24);crypto.getRandomValues(r);key=Array.from(r,x=>x.toString(16).padStart(2,"0")).join("");lsSet("gm_key",key);$("t_key").value=key}
      let src=new TextDecoder().decode(Uint8Array.from(atob(BRIDGE_B64),c=>c.charCodeAt(0)));
      src=src.replace("const BRIDGE_KEY = 'CAMBIA_ESTA_CLAVE_LARGA';","const BRIDGE_KEY = '"+key+"';").replace("const ALLOWED_ORIGIN = 'https://zeer866.github.io';","const ALLOWED_ORIGIN = '"+location.origin+"';");
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([src],{type:"text/x-php"}));a.download="bridge.php";document.body.append(a);a.click();a.remove();
      toast("bridge.php descargado con tu clave");
    };
    v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
    v.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>runCmd(b.dataset.q));
    const send=()=>{const i=$("tin"),l=i.value;i.value="";runCmd(l)};
    $("tgo").onclick=send;$("tin").onkeydown=e=>{if(e.key==="Enter")send()};
    const o=$("tout");
    if(!tlines.length)print("GDPS MANAGER Terminal · escribe ayuda para ver los comandos.");
    else tlines.forEach(([t,c])=>addLine(o,t,c));
    o.scrollTop=o.scrollHeight;
  }
  v.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===tmode));
  $("tin").placeholder=tmode==="real"?"[real] escribe un comando":"[plataforma] escribe un comando";
}
async function runCmd(line){
  line=(line||"").trim();if(!line)return;
  print("> "+line,"in");
  if(tpend){const p=tpend;tpend=null;if(/^(s|si|sí|y|yes)$/i.test(line))await real(p);else print("Cancelado.");return}
  const [c0,...a]=toks(line),c=(c0||"").toLowerCase();
  if(c==="limpiar"||c==="clear"){tlines=[];const o=$("tout");if(o)o.innerHTML="";return}
  if(c==="ayuda"||c==="help"){print(tmode==="real"?HELP_REAL:HELP_PLAT);return}
  if(c==="modo"){const m=(a[0]||"").toLowerCase();if(m==="real")setMode("real");else if(m==="plataforma")setMode("plat");else print("Uso: modo real | modo plataforma","err");return}
  try{
    if(tmode==="real"){
      if(MUT.includes(c)){tpend=line;print("⚠ Esto cambia tu GDPS real. Escribe s para confirmar, o cualquier otra cosa para cancelar.","err");return}
      await real(line);
    }else await plat(c,a,line);
  }catch(e){print(errTxt(e),"err")}
}
async function real(line){
  const url=lsGet("gm_url"),key=lsGet("gm_key");
  if(!url||!key){print("Falta configurar la URL y la clave. Abre «Configurar conexión con mi GDPS».","err");return}
  if(!/^https:\/\//i.test(url)){print("La URL debe empezar con https://","err");return}
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","X-Key":key},body:JSON.stringify({cmd:line})});
    const j=await r.json();
    print(j.ok?j.out:"Error: "+j.err,j.ok?"":"err");
  }catch(e){print("No se pudo conectar. Revisa que la URL sea correcta, que bridge.php esté subido y que tu GDPS use https. ("+e.message+")","err")}
}
function pick(list,name){
  const n=String(name||"").toLowerCase();
  const ex=list.filter(x=>String(x.name).toLowerCase()===n);if(ex.length===1)return ex[0];
  const p=list.filter(x=>String(x.name).toLowerCase().includes(n));
  return p.length===1?p[0]:(p.length?"amb":null);
}
async function plat(c,a,line){
  if(c==="mis"){print(all.length?all.map((g,i)=>`${i+1}. ${g.name}${g.id===tgd?"  ← en uso":""}`).join("\n"):"No tienes GDPS registrados. Registra uno en Mis GDPS.");return}
  if(c==="use"){
    if(!a[0]){print("Uso: use <número o nombre>","err");return}
    const g=all[Number(a[0])-1]||all.find(x=>x.name.toLowerCase()===a.join(" ").toLowerCase());
    if(!g){print("No encontré ese GDPS. Escribe mis para verlos.","err");return}
    tgd=g.id;print("Usando: "+g.name);return;
  }
  if(!all.some(g=>g.id===tgd))tgd=all.length===1?all[0].id:null;
  if(!tgd){print(all.length?"Primero elige un GDPS: escribe mis y luego use <n>.":"No tienes GDPS registrados. Registra uno en Mis GDPS.","err");return}
  const load=async n=>(await getDocs(collection(db,"gdps",tgd,n))).docs.map(d=>({id:d.id,...d.data()}));
  const upd=async(n,name,patch,msg)=>{
    if(!name){print("Falta el nombre.","err");return}
    const m=pick(await load(n),name);
    if(!m){print("No encontré «"+name+"».","err");return}
    if(m==="amb"){print("Hay varios que coinciden con «"+name+"». Sé más específico.","err");return}
    await updateDoc(doc(db,"gdps",tgd,n,m.id),patch);print(msg(m));
  };
  if(c==="usuarios"){const l=await load("members");print(l.length?l.map(u=>`${u.name} · ${u.role} · ⭐${u.stars||0}${u.banned?" · BANEADO":""}`).join("\n"):"Aún no hay usuarios.");return}
  if(c==="niveles"){const l=await load("levels");print(l.length?l.map(x=>`${x.name} · ${x.author} · ${x.difficulty}${x.featured?" · DESTACADO":""}`).join("\n"):"Aún no hay niveles.");return}
  if(c==="stats"){const u=await load("members"),l=await load("levels"),an=await load("announcements");print(`usuarios: ${u.length} (baneados: ${u.filter(x=>x.banned).length})\nniveles: ${l.length} (destacados: ${l.filter(x=>x.featured).length})\nanuncios: ${an.length}`);return}
  if(c==="agregar"){const n=a.join(" ");if(!n){print("Uso: agregar <nombre>","err");return}await addDoc(collection(db,"gdps",tgd,"members"),{name:n,role:"Jugador",stars:0,banned:false,createdAt:serverTimestamp()});print("Usuario agregado: "+n);return}
  if(c==="ban"||c==="unban"){await upd("members",a.join(" "),{banned:c==="ban"},m=>(c==="ban"?"Baneado: ":"Desbaneado: ")+m.name);return}
  if(c==="rol"){
    const r={jugador:"Jugador",mod:"Mod",admin:"Admin"}[(a[a.length-1]||"").toLowerCase()];
    if(a.length<2||!r){print("Uso: rol <nombre> <Jugador|Mod|Admin>","err");return}
    await upd("members",a.slice(0,-1).join(" "),{role:r},m=>`${m.name} ahora es ${r}`);return;
  }
  if(c==="estrellas"){
    const n=Number(a[a.length-1]);
    if(a.length<2||Number.isNaN(n)){print("Uso: estrellas <nombre> <n>","err");return}
    await upd("members",a.slice(0,-1).join(" "),{stars:n},m=>`${m.name} tiene ${n} estrellas`);return;
  }
  if(c==="destacar"||c==="quitar"){await upd("levels",a.join(" "),{featured:c==="destacar"},m=>(c==="destacar"?"Destacado: ":"Quitado de destacados: ")+m.name);return}
  if(c==="anuncio"){
    const t=line.replace(/^\S+\s*/,"").trim();
    if(!t){print("Uso: anuncio <texto>","err");return}
    await addDoc(collection(db,"gdps",tgd,"announcements"),{title:t.slice(0,60),body:t,createdAt:serverTimestamp()});print("Anuncio publicado.");return;
  }
  print("Comando desconocido: "+c+". Escribe ayuda.","err");
}

const RULES=String.raw`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /gdps/{g} {
      function isOwner() {
        return request.auth != null &&
          get(/databases/$(database)/documents/gdps/$(g)).data.ownerUid == request.auth.uid;
      }
      function isPublished() {
        return get(/databases/$(database)/documents/gdps/$(g)).data.get('published', false) == true;
      }
      allow read: if resource.data.get('published', false) == true
        || (request.auth != null && resource.data.ownerUid == request.auth.uid);
      allow create: if request.auth != null
        && request.resource.data.ownerUid == request.auth.uid;
      allow update: if isOwner()
        && request.resource.data.ownerUid == resource.data.ownerUid;
      allow delete: if isOwner();
      match /announcements/{id} {
        allow read: if isPublished() || isOwner();
        allow write: if isOwner();
      }
      match /levels/{id} {
        allow read: if isPublished() || isOwner();
        allow write: if isOwner();
      }
      match /members/{id} {
        allow read, write: if isOwner();
      }
    }
    match /global_posts/{id} {
      allow read: if true;
      allow create: if request.auth != null
        && request.resource.data.uid == request.auth.uid
        && request.resource.data.text is string
        && request.resource.data.text.size() > 0
        && request.resource.data.text.size() <= 1000;
      allow update: if request.auth != null
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['likes']);
      allow delete: if request.auth != null && resource.data.uid == request.auth.uid;
    }
    match /global_chat/{id} {
      allow read: if true;
      allow create: if request.auth != null
        && request.resource.data.uid == request.auth.uid
        && request.resource.data.text is string
        && request.resource.data.text.size() > 0
        && request.resource.data.text.size() <= 500;
      allow delete: if request.auth != null && resource.data.uid == request.auth.uid;
    }
    match /apks/{id} {
      allow read: if true;
      allow create: if request.auth != null && request.resource.data.uid == request.auth.uid;
      allow delete: if request.auth != null && resource.data.uid == request.auth.uid;
    }
  }
}`;
